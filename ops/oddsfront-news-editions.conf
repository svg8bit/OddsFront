[Unit]
OnSuccess=oddsfront-telegram.service

[Service]
ExecStart=
ExecStart=/usr/bin/env node scripts/news/run-edition.mjs --with-followups
ExecStartPost=
# One edition of ten stories per day on this VPS: the Codex subscription is
# shared with ColdMath news. Remove the line to return to the two-hour default.
Environment=ODDSFRONT_NEWS_EDITION_INTERVAL_HOURS=24
TimeoutStartSec=150min
